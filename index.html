<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
:root{--bg:#f2f5f7;--card:#fff;--tx:#0f1b24;--mu:#5b6b78;--ac:#0f766e;--onac:#fff;--ac2:#d5f5ef;--bd:#dce3e8;--wa:#b45309;--wabg:#fef3c7;--ok:#15803d;--okbg:#dcfce7;--dn:#b91c1c;--albg:#fee2e2}
@media(prefers-color-scheme:dark){:root{--bg:#0b1218;--card:#141f28;--tx:#e8eef2;--mu:#8fa1ae;--ac:#2dd4bf;--onac:#06201e;--ac2:#0f3b38;--bd:#25343f;--wa:#fbbf24;--wabg:#3a2e0b;--ok:#4ade80;--okbg:#0f3320;--dn:#f87171;--albg:#3b1414}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.card,.tab,nav,.chip,.sil,.nota,.th,.tg,.ib,.btn,summary{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.lrow{display:flex;justify-content:space-between;align-items:flex-end}
.lrow button{font-size:13px;color:var(--ac);font-weight:700;padding:6px 8px}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden;overscroll-behavior-x:none}#ov{overscroll-behavior-x:none}
#app{max-width:640px;margin:0 auto;padding:0 12px calc(96px + env(safe-area-inset-bottom))}
#pane{display:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.datebar .d{flex:1;text-align:center;font-weight:700;font-size:18px;text-transform:capitalize;min-width:0}
.datebar .d small{display:block;font-weight:500;color:var(--mu);font-size:13px;text-transform:none}
.ib{width:44px;height:44px;flex:none;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:20px}
.ib.pl{background:var(--ac);color:var(--onac);border-color:var(--ac);font-size:26px;font-weight:700;line-height:1}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{position:relative;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-weight:700}
.tab.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.tab i{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;font-style:normal;font-size:12px;line-height:20px;padding:0 5px;font-weight:700}
.tab i.w{background:var(--wa);color:#fff}.tab i.k{background:var(--ok);color:#fff}
.card{display:grid;grid-template-columns:54px 1fr 64px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-top:10px;cursor:pointer}
.card[hidden]{display:none!important}.card{grid-template-columns:54px minmax(0,1fr)}.card.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.sil{text-align:center;background:var(--ac2);border-radius:10px;padding:6px 0}.sil small{display:block;font-size:10px;color:var(--mu)}.sil b{font-size:22px}
.nm{font-weight:700;overflow-wrap:anywhere}.ex{color:var(--mu);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;background:var(--ac2);border-radius:8px;padding:2px 7px}.chip.w{background:var(--wabg);color:var(--wa);font-weight:600}
.cm{margin-top:4px;font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.nota{height:56px;border-radius:12px;border:2px solid var(--wa);background:var(--wabg);color:var(--wa);font-size:24px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.nota small{font-size:11px;font-weight:600}.nota.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.ax{background:transparent;border:1px solid var(--bd);font-weight:600}
.chip.al{background:var(--albg);color:var(--dn);font-weight:600}
.chip.ev{background:var(--ac2);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tg{padding:9px 13px;border-radius:20px;border:1px solid var(--bd);background:var(--card);font-size:14px}
.tg.on{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:700}
.tgrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.tgrow span{flex:1}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.addend{display:block;width:100%;margin-top:14px;padding:14px;border-radius:14px;border:2px dashed var(--ac);color:var(--ac);font-weight:700;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:62px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav button span{font-size:22px}nav button.on{color:var(--ac);font-weight:700}
nav button em{position:absolute;top:6px;left:calc(50% + 6px);background:var(--wa);color:#fff;font-style:normal;font-size:11px;border-radius:9px;min-width:18px;padding:0 5px;line-height:18px}
#ov{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
#ov.on{display:flex}
.sheet > *, .sheet .box, .sheet textarea, .sheet input, .sheet select{max-width:100%}.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:none;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.sh-head > *{min-width:0}.sh-head{position:sticky;top:0;z-index:4;background:var(--bg);margin:-14px -14px 8px;padding:14px 14px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;box-shadow:0 1px 0 var(--bd)}
.sh-act{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.sv{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s;white-space:nowrap}.sv.on{opacity:1}.sv.err{color:var(--dn);font-weight:700}
[data-close],.btn,.pri{background:var(--ac);color:var(--onac);border-radius:12px;padding:12px 16px;font-weight:700;display:inline-block;text-align:center}
.pri{width:100%;margin-top:12px;font-size:17px}
.dng{width:100%;margin-top:20px;border:1px solid var(--dn);color:var(--dn);border-radius:12px;padding:12px;font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input:not([type]),input[type=search],input[type=email],input[type=password],select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:16px}
.nm-in{font-weight:700;font-size:18px!important}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row>*{min-width:0}
.hint{font-size:13px;color:var(--wa);margin-top:8px}
#a-sug button{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:6px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
#a-sug small{color:var(--mu)}
h4{margin:18px 0 6px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.notabig{display:block;width:auto;max-width:100%;margin:10px 0 0 auto;padding:7px 12px;border-radius:10px;font-weight:650;font-size:13px;border:2px solid var(--wa);background:var(--wabg);color:var(--wa)}
.notabig.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.th{width:96px}.th img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);display:block}.th small{display:block;font-size:11px;color:var(--mu);text-align:center}
.pr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-top:6px}
.pr span{flex:1;overflow-wrap:anywhere}.pr.dn span{text-decoration:line-through;color:var(--mu)}
.ck{width:32px;height:32px;border-radius:8px;border:2px solid var(--ac);font-weight:800;color:var(--onac);flex:none}.ck.on{background:var(--ac)}
.x{font-size:22px;color:var(--mu);width:32px;height:32px}
.addrow{display:flex;gap:8px;margin-top:8px;min-width:0}.addrow input{flex:1 1 0;min-width:0;width:0}.addrow button{flex:0 0 auto;min-width:76px;width:auto;padding:8px 10px;white-space:nowrap;border-radius:12px;background:var(--ac);color:var(--onac);font-size:14px;font-weight:700}
.mu{color:var(--mu);font-size:14px}
details{margin-top:12px}summary{padding:6px 0;color:var(--mu);font-weight:600}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.box h3{margin:0 0 6px;font-size:16px}.box p{margin:6px 0;font-size:14px;color:var(--mu)}
.box .btn{margin-top:8px;margin-right:6px}.box .sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.banner{background:var(--wabg);color:var(--wa);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.banner button{margin-left:auto;font-size:20px;color:inherit}
.pg{margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.pg .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;display:none;max-width:90%}
#vw{display:none;position:fixed;inset:0;background:#000;z-index:30;flex-direction:column}
#vw.on{display:flex}
#vw .bar{display:flex;gap:8px;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
#vw .bar button{background:#fff2;color:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
#vw .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#vw img{width:100%;max-width:none;display:block;pointer-events:none}
@media (pointer:fine){#vw .sc{cursor:grab;user-select:none}#vw .sc.dragging{cursor:grabbing}#vw img{user-select:none;-webkit-user-drag:none}}
.calc{max-width:420px;margin:8px auto 0}
.cdisp{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;text-align:right;-webkit-user-select:none;user-select:none;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cexpr{color:var(--mu);font-size:15px;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnum{font-size:44px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.cnum.sm{font-size:32px}.cnum.xs{font-size:24px}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.kb{height:64px;border-radius:16px;background:var(--card);border:1px solid var(--bd);font-size:24px;font-weight:600}
.kb:active{filter:brightness(.9)}
.kb.fn{background:var(--ac2);color:var(--tx)}
.kb.op{background:var(--wabg);color:var(--wa);font-size:28px}
.kb.eq{background:var(--ac);color:var(--onac);border-color:var(--ac);font-size:28px}
#e-nt{font-size:15px;line-height:1.45;min-height:150px;white-space:pre-wrap}
.ntrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ntrow button{padding:10px 14px;font-size:14px;font-weight:600;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
.ntrow .ntc{margin-left:auto;font-size:12px;color:var(--mu)}
/* Pantallas grandes (iPad, Windows): lista a la izquierda, paciente a la derecha */
@media(min-width:900px){
  #app{max-width:1180px}
  #cols{display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:16px;align-items:start}
  #pane{display:block;position:sticky;top:calc(10px + env(safe-area-inset-top))}
  #pane:empty::before{content:'Elige un paciente de la lista o agrega uno nuevo';display:block;color:var(--mu);text-align:center;padding:70px 20px;border:2px dashed var(--bd);border-radius:18px}
  #pane .sheet{max-width:none;max-height:calc(100vh - 100px - env(safe-area-inset-bottom));border-radius:16px;border:1px solid var(--bd);padding-bottom:20px}
  #cols[data-v=pend],#cols[data-v=resp],#cols[data-v=calc],#cols[data-v=archivo]{grid-template-columns:1fr;max-width:640px;margin:0 auto}
  #cols[data-v=pend] #pane,#cols[data-v=resp] #pane,#cols[data-v=calc] #pane,#cols[data-v=archivo] #pane{display:none}
}
.prev-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9em;max-height:190px;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px;margin:3px 0 6px}
  .compact-details{margin:5px 0;padding:6px 9px;border:1px solid var(--bd,#ddd);border-radius:9px}
  .compact-details summary{font-size:13px;cursor:pointer;font-weight:600}
  #e-prev-info .prev-text{max-height:100px;overflow:auto;font-size:12px;line-height:1.35}
  #e-prev-fotos .th{width:86px;max-width:30%;vertical-align:top}
  #e-prev-fotos .th img{max-height:85px;object-fit:cover}
  #calc-floating .ckeys{touch-action:manipulation}

/* Pase compacto: navegación en una sola línea y sin saltos en iPhone */
.visit-head{align-items:center;gap:7px;flex-wrap:nowrap;min-width:0}
.visit-identity{flex:1 1 0;min-width:0;overflow:hidden}
.visit-identity .nm-in{width:100%;max-width:100%;min-width:0;padding:7px 8px;font-size:17px!important}
.visit-identity .ex{font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visit-actions{display:flex;align-items:center;flex:0 0 auto;gap:5px;min-width:0}
.visit-switch{display:flex;align-items:center;gap:2px;border:1px solid var(--bd);border-radius:11px;background:var(--card);padding:2px}
.visit-switch .ib{width:30px;height:32px;min-width:30px;min-height:32px;padding:0!important;border:0;background:transparent;border-radius:8px;font-size:22px;line-height:1}
.visit-switch .ib:disabled{opacity:.25}
.visit-counter{font-size:11px;color:var(--mu);white-space:nowrap;min-width:24px;text-align:center}
.visit-done{padding:7px 9px!important;border-radius:10px!important;font-size:12px!important;min-height:36px!important;white-space:nowrap}
.visit-head .sv{position:absolute;right:12px;top:100%;font-size:10px}
.visit-notes .row{margin-top:8px}
@media(max-width:365px){.visit-identity .nm-in{font-size:15px!important}.visit-switch .ib{width:27px;min-width:27px}.visit-actions{gap:3px}}

/* Buscar pacientes sin interrumpir el pase */
.pase-search{margin-top:8px}
.pase-search label{margin:0 0 4px;font-size:12px}
.pase-search-line{display:flex;gap:7px;min-width:0}
.pase-search-line input{flex:1;min-width:0;padding:9px 11px;border-radius:11px}
.pase-search-line button{flex:none;color:var(--ac);background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:7px 10px;font-size:13px;font-weight:650}
.pase-search small{color:var(--mu);display:block;margin-top:3px;font-size:11px}
.visit-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:4px 0 10px}
.visit-tabs button{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:10px;color:var(--tx);font-size:14px;font-weight:700}
.visit-tabs button.active{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.visit-page[hidden]{display:none!important}
.visit-note-help{font-size:12px;color:var(--mu);margin:5px 0}
.note-tools{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.note-tools button{border:1px solid var(--bd);border-radius:9px;background:var(--card);padding:7px 9px;font-size:12px;color:var(--tx)}
.note-tools button:active{background:var(--ac2)}
#e-nt{width:100%;min-height:230px;line-height:1.48;font-size:15px;resize:vertical}
.visit-note-area{margin:6px 0;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.visit-note-area label{margin-top:7px}
.visit-note-prev{max-height:110px;overflow:auto;white-space:pre-wrap;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:8px;font-size:12px}
@media(max-width:380px){.note-tools button{font-size:11px;padding:7px}}
</style>
</head>
<body>
<div id="app"><div id="cols" data-v="hoy"><div id="main"></div><div id="pane"></div></div></div>
<nav>
  <button data-v="hoy"><span>🩺</span>Pase</button>
  <button data-v="pend"><span>⏳</span>Pendientes</button>
  <button data-v="resp"><span>⚙️</span>Ajustes</button>
</nav>
<div id="ov"></div>
<div id="vw"><div class="bar"><button id="v-zoom">🔍 Zoom</button><button id="v-del">🗑 Borrar</button><button id="v-x">Cerrar</button></div><div class="sc"><img id="v-img" alt="Hoja de signos"></div></div>
<div id="toast"></div>

<script>
'use strict';
const VERSION='11.1';
const TURNOS=[1,2,3,4,5];
const DIAS_FOTO=7;
const ACCESOS=['FAV','Injerto','Catéter tunelizado','Catéter temporal'];
const DEF_TAGS=['Disfunción de catéter','Sangrado / hematoma','Sospecha de infección','Hipotensión','Hipertensión','Calambres','Náusea / vómito','Dolor torácico / arritmia','Ganancia alta','Sesión incompleta','Laboratorio','Interconsulta'];
const DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const now=()=>Date.now();
const todayStr=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const fmtFecha=s=>new Date(s+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
const normExp=s=>String(s||'').trim().toUpperCase();
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- Registro de errores (se ve en Ajustes) ---------- */
function readErrs(){try{const a=JSON.parse(lsGet('errlog')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function logErr(donde,err){
  try{
    const a=readErrs();
    a.push({t:Date.now(),d:donde,m:String(err&&err.message||err),s:String(err&&err.stack||'').slice(0,300)});
    while(a.length>30)a.shift();
    lsSet('errlog',JSON.stringify(a));
  }catch(e){}
  try{console.error(donde,err)}catch(e){}
}
window.addEventListener('error',e=>logErr('error',e.error||e.message));
window.addEventListener('unhandledrejection',e=>logErr('promesa',e.reason));

/* ---------- IndexedDB ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('pase-hd',2);
  r.onupgradeneeded=ev=>{const d=r.result;
    if(ev.oldVersion<1){
      d.createObjectStore('patients',{keyPath:'expediente'});
      const e=d.createObjectStore('entries',{keyPath:'id'});e.createIndex('fecha','fecha');
      d.createObjectStore('photos',{keyPath:'id'});
      d.createObjectStore('meta',{keyPath:'k'});}
    // versión 2: índice de fotos por sesión (para unir fotos que llegan antes que su sesión)
    const ps=r.transaction.objectStore('photos');
    if(!ps.indexNames.contains('entry'))ps.createIndex('entry','entry');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const rq=req=>new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});
const store=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const get=(n,k)=>rq(store(n).get(k));
const putRaw=(n,v)=>rq(store(n,'readwrite').put(v));
// Toda escritura local de pacientes, sesiones y etiquetas se avisa a la sincronización (si está activa).

const del=(n,k)=>rq(store(n,'readwrite').delete(k));

// Pendientes: cada uno lleva su propia fecha de cambio; borrar = marcar (del) para que el borrado también se sincronice.
const pStamp=x=>x.updatedAt||x.hechoEn||x.creado||0;
const pAct=p=>(p&&p.pendientes||[]).filter(x=>!x.hecho&&!x.del);
const pDone=p=>(p&&p.pendientes||[]).filter(x=>x.hecho&&!x.del);
const patStamp=p=>p.pu||p.updatedAt||0;
// Une dos copias de un paciente (importar archivo): perfil por fecha de perfil, pendientes uno por uno.
function mergePat(cur,r){
  if(!cur)return r;
  const out={...cur};
  if(patStamp(r)>patStamp(cur)){out.nombre=r.nombre;out.acceso=r.acceso;out.aviso=r.aviso;out.notaFija=r.notaFija;out.pu=patStamp(r)}
  const m=new Map((cur.pendientes||[]).map(x=>[x.id,x]));
  for(const x of r.pendientes||[]){const c=m.get(x.id);if(!c||pStamp(x)>pStamp(c))m.set(x.id,x)}
  out.pendientes=[...m.values()];
  out.updatedAt=Math.max(cur.updatedAt||0,r.updatedAt||0);
  return out;
}

/* ---------- Calculadora simple (suma, resta, multiplicación, división, %, signo) ---------- */
const C={disp:'0',acc:null,op:null,fresh:true,rep:false,eq:false,expr:''};
const COPS={'+':'+','-':'−','*':'×','/':'÷'};
const cFmt=n=>isFinite(n)?String(parseFloat(n.toPrecision(12))):'Error';
function cCalc(a,op,b){return op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:op==='/'?(b===0?NaN:a/b):b}
function calcReset(){C.disp='0';C.acc=null;C.op=null;C.fresh=true;C.rep=false;C.eq=false;C.expr=''}
function calcShow(){
  const root=$('#calc-floating')||document;const n=$('#c-disp',root);if(!n)return;
  n.textContent=C.disp;
  n.className='cnum'+(C.disp.length>14?' xs':C.disp.length>9?' sm':'');
  $('#c-expr',root).textContent=C.expr||' ';
}
function calcKey(k){
  if(C.disp==='Error'&&k!=='C'){calcReset()}
  const cur=parseFloat(C.disp);
  if(/^[0-9]$/.test(k)){
    if(C.fresh||C.rep){C.disp=k;C.fresh=false;C.rep=false;if(C.eq){C.expr='';C.eq=false}}
    else if(C.disp==='0')C.disp=k;
    else if(C.disp.replace(/[-.]/g,'').length<12)C.disp+=k;
  }else if(k==='.'){
    if(C.fresh||C.rep){C.disp='0.';C.fresh=false;C.rep=false;if(C.eq){C.expr='';C.eq=false}}
    else if(!C.disp.includes('.'))C.disp+='.';
  }else if(k==='+'||k==='-'||k==='*'||k==='/'){
    if(C.op!==null&&C.acc!==null&&!C.fresh){
      const r=cCalc(C.acc,C.op,cur);
      if(!isFinite(r)){calcReset();C.disp='Error';calcShow();return}
      C.acc=r;C.disp=cFmt(r);
    }else if(C.op===null||C.acc===null)C.acc=cur;
    C.op=k;C.fresh=true;C.rep=false;C.eq=false;C.expr=cFmt(C.acc)+' '+COPS[k];
  }else if(k==='='){
    if(C.op!==null&&C.acc!==null){
      const r=cCalc(C.acc,C.op,cur);
      C.expr=cFmt(C.acc)+' '+COPS[C.op]+' '+cFmt(cur)+' =';
      C.disp=isFinite(r)?cFmt(r):'Error';
      C.acc=null;C.op=null;C.fresh=true;C.rep=false;C.eq=true;
    }
  }else if(k==='%'){
    const v=(C.op==='+'||C.op==='-')&&C.acc!==null?C.acc*cur/100:cur/100;
    C.disp=cFmt(v);C.rep=true;C.fresh=false;
  }else if(k==='pm'){
    if(C.disp!=='0')C.disp=C.disp[0]==='-'?C.disp.slice(1):'-'+C.disp;
  }else if(k==='B'){
    if(!C.fresh&&!C.rep)C.disp=(C.disp.length>1&&!(C.disp.length===2&&C.disp[0]==='-'))?C.disp.slice(0,-1):'0';
  }else if(k==='C')calcReset();
  calcShow();
}
function renderCalc(){
  const keys=[['C','fn','C'],['B','fn','⌫'],['%','fn','%'],['/','op','÷'],['7'],['8'],['9'],['*','op','×'],['4'],['5'],['6'],['-','op','−'],['1'],['2'],['3'],['+','op','+'],['pm','fn','±'],['0'],['.',' ','.'],['=','eq','=']];
  $('#main').innerHTML=`<div class="top"><div class="datebar"><div class="d">Calculadora<small>Diferencias de peso, volumen, etc.</small></div></div></div>
    <div class="calc"><div class="cdisp"><div class="cexpr" id="c-expr">&nbsp;</div><div class="cnum" id="c-disp">0</div></div>
    <div class="ckeys">${keys.map(([k,c,l])=>`<button class="kb ${c||''}" data-k="${k}">${l||k}</button>`).join('')}</div>
    <p class="mu" style="text-align:center;margin-top:12px">Ejemplo: peso actual − peso seco = ganancia de peso. También funciona con el teclado.</p></div>`;

// teclado físico (iPad con teclado, Windows): solo en la pestaña Calc y sin otra ventana abierta
function calcFromKeyboard(ev){
  if(S.view!=='calc'||sheetEl||$('#vw').classList.contains('on'))return false;
  const tg=ev.target&&ev.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return false;
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return false;
  const k=ev.key;let m=null;
  if(/^[0-9]$/.test(k))m=k;
  else if(k==='.'||k===',')m='.';
  else if(k==='+'||k==='-'||k==='*'||k==='/')m=k;
  else if(k==='Enter'||k==='=')m='=';
  else if(k==='Backspace')m='B';
  else if(k==='Escape'||k==='Delete'||k==='c'||k==='C')m='C';
  else if(k==='%')m='%';
  if(m===null)return false;
  ev.preventDefault();calcKey(m);return true;
}

function closeSheet(skipRender){

}

  const sh=openSheet(`<div class="sh-head"><b style="font-size:18px;padding-top:10px">Agregar paciente</b><button data-close>Cerrar</button></div>
    <label>Buscar por número de expediente</label><input id="a-exp" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" autocomplete="off" autocorrect="off" placeholder="Número de expediente">
    <label>Nombre (se completa si el expediente ya existe)</label><input id="a-nom" autocomplete="off">
    <div id="a-sug"></div>
    <div class="row"><div><label>Turno</label><select id="a-tur">${turnoOpts(S.turno)}</select></div>
    <div><label>Sillón</label><input id="a-sil" inputmode="numeric" autocomplete="off"></div></div>
    <div id="a-hint" class="hint"></div>
    <label style="display:flex;align-items:center;gap:8px;margin:12px 0"><input id="a-rapid" type="checkbox" checked style="width:auto"> Captura rápida: continuar con el siguiente paciente</label><button class="pri" id="a-ok">Guardar paciente y sillón</button><div id="a-count" class="mu" aria-live="polite"></div>`);
  const exp=$('#a-exp',sh),nom=$('#a-nom',sh),sug=$('#a-sug',sh),hint=$('#a-hint',sh);
  let auto=false;
  const upd=(src)=>{
    const q=(src.value||'').trim().toLowerCase();
    const k=normExp(exp.value);const known=pats.find(p=>p.expediente===k);
    if(known){
      if(!nom.value.trim()||auto){nom.value=known.nombre||'';auto=true}
      const o=pAct(known);
      hint.textContent=o.length?`Paciente conocido · ${o.length} pendiente${o.length>1?'s':''} abierto${o.length>1?'s':''}: ${o.map(x=>x.texto).join('; ')}`:'Paciente conocido';
    }else hint.textContent='';
    if(src===nom)auto=false;
    const m=q?pats.filter(p=>p.expediente.toLowerCase().startsWith(q)).filter(p=>p.expediente!==k).slice(0,5):[];
    sug.innerHTML=m.map(p=>`<button data-sg="${esc(p.expediente)}">${esc(p.nombre||'(sin nombre)')} <small>· ${esc(p.expediente)}</small></button>`).join('');
  };
  exp.addEventListener('input',()=>upd(exp));nom.addEventListener('input',()=>upd(nom));

  sug.addEventListener('click',ev=>{const b=ev.target.closest('[data-sg]');if(!b)return;const p=pats.find(x=>x.expediente===b.dataset.sg);exp.value=p.expediente;nom.value=p.nombre||'';auto=true;upd(exp);sug.innerHTML=''});
  let count=0;
  const saveQuick=async()=>{
    const rapid=$('#a-rapid',sh).checked;
    const result=await addEntry(exp.value,nom.value,+$('#a-tur',sh).value,$('#a-sil',sh).value,rapid);
    if(rapid&&result==='added'){
      count++;$('#a-count',sh).textContent=`${count} paciente${count===1?'':'s'} agregado${count===1?'':'s'} en esta captura`;
      exp.value='';nom.value='';$('#a-sil',sh).value='';sug.innerHTML='';hint.textContent='';auto=false;exp.focus();
    }
  };
  $('#a-ok',sh).onclick=()=>saveQuick().catch(err=>{logErr('agregar',err);toast('No se pudo agregar')});
  $('#a-sil',sh).addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();saveQuick().catch(err=>logErr('agregar',err))}});
  exp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();$('#a-sil',sh).focus()}});
  setTimeout(()=>exp.focus(),50);
}

async function addEntry(expRaw,nom,tur,sil,rapid=false){
  const exp=normExp(expRaw);if(!exp){toast('Falta el expediente');return}
  nom=nom.trim();sil=sil.trim();
  let pat=await get('patients',exp);
  if(!pat)pat={expediente:exp,nombre:'',pendientes:[],updatedAt:now(),pu:now()};
  if(nom&&nom!==pat.nombre){pat.nombre=nom;pat.updatedAt=now();pat.pu=now()}
  await put('patients',pat);
  const ents=await byDate(S.fecha);
  const dup=ents.find(e=>e.expediente===exp);
  if(dup){
    if(dup.turno===tur){toast('Ya está en este turno');if(!rapid){S.turno=tur;closeSheet();openEntry(dup.id)}return 'duplicate'}
    if(confirm(`${pat.nombre||exp} ya está en la lista de esta fecha (turno ${dup.turno}${dup.sillon?', sillón '+dup.sillon:''}). ¿Moverlo al turno ${tur}?`)){
      dup.turno=tur;if(sil)dup.sillon=sil;dup.updatedAt=now();await put('entries',dup);S.turno=tur;lsSet('turno',tur);
      closeSheet();openEntry(dup.id);
    }
    return;
  }
  const e={id:uid(),fecha:S.fecha,turno:tur,sillon:sil,expediente:exp,comentario:'',nota:false,fotos:[],tags:[],extras:{},creado:now(),updatedAt:now()};
  await put('entries',e);S.turno=tur;lsSet('turno',tur);
  if(!rapid){closeSheet();openEntry(e.id)}else{toast('Paciente agregado');render().catch(()=>{})}
  return 'added';
}

async function openEntry(id){

      <div class="visit-note-area">
        <b>Nota de hemodiálisis</b>

        <div class="note-tools" id="e-placeholders"><button type="button" data-token="[PESO_SECO]">[Peso seco]</button><button type="button" data-token="[GANANCIA]">[Ganancia]</button><button type="button" data-token="[TA]">[TA]</button><button type="button" data-token="[OTROS]">[Otros]</button></div>
        <label for="e-nt">Texto de la nota</label><textarea id="e-nt" rows="10" spellcheck="false" placeholder="Pega aquí la nota del paciente…">${esc(e.notaTxt||'')}</textarea>
        <div class="note-tools"><button type="button" id="e-note-prior">Reutilizar nota anterior</button><button type="button" id="e-note-paste">Pegar</button><button type="button" id="e-note-copy">Copiar nota con datos</button></div>
        <small class="mu">Sin botón de guardar: los cambios se guardan automáticamente.</small>

      <div class="visit-note-area"><b>Etiquetas de eventos de la sesión</b><div class="tags" id="e-tags"></div></div>
      <details class="compact-details"><summary>Ver nota fija del paciente</summary><div class="prev-text">${esc(pat.notaFija||'Sin nota fija')}</div></details>
    </div>`);
  S.sel=e.id;refreshList();
  $('#e-cal',sh).onclick=()=>openCalcFloating();
  loadHistory(e.expediente,e.id,sh);
  loadPreviousInfo(e.expediente,e.id,sh);
  loadPreviousPhotos(e.expediente,e.id,sh);
  const q=s=>$(s,sh);
  let tm=null;
  let curNotaFija=pat.notaFija||'';
  const setVisitTab=tab=>{
    for(const x of ['pase','nota']){
      q('#vp-'+x).hidden=x!==tab;
      const b=q('#vt-'+x);b.classList.toggle('active',x===tab);b.setAttribute('aria-selected',String(x===tab));
    }
    // Volver al inicio de la ficha, no al inicio de la página de fondo.

  };
  q('#vt-pase').onclick=()=>setVisitTab('pase');
  q('#vt-nota').onclick=()=>setVisitTab('nota');
  const freshPat=async()=>(await get('patients',e.expediente))||{expediente:e.expediente,nombre:'',pendientes:[],updatedAt:0,pu:0};
  const sv=ok=>{const s=q('#e-sv');if(!s)return;s.textContent=ok?'Guardado ✓':'No se pudo guardar';s.className='sv on'+(ok?'':' err');clearTimeout(sv.t);if(ok)sv.t=setTimeout(()=>s.classList.remove('on'),1500)};
  const flushRaw=async()=>{clearTimeout(tm);tm=null;
    e.comentario=q('#e-com').value;e.sillon=q('#e-sil').value.trim();e.notaTxt=q('#e-nt').value;
    e.extras={peso:q('#x-peso').value,gan:q('#x-gan').value,ta:q('#x-ta').value,otro:q('#x-otro').value};
    e.updatedAt=now();await put('entries',e);
    // el perfil se escribe sobre la copia más reciente del paciente (por si otro dispositivo cambió pendientes)
    const nn=q('#e-nom').value.trim(),ac=q('#e-ac').value,av=q('#e-av').value.trim(),nf=curNotaFija;
    const cur=await freshPat();
    if(nn!==(cur.nombre||'')||ac!==(cur.acceso||'')||av!==(cur.aviso||'')||nf!==(cur.notaFija||'')){
      cur.nombre=nn;cur.acceso=ac;cur.aviso=av;cur.notaFija=nf;cur.pu=now();cur.updatedAt=now();await put('patients',cur)}
    pat=cur;
    refreshList()};
  const mutPat=async fn=>{const cur=await freshPat();fn(cur);cur.updatedAt=now();await put('patients',cur);pat=cur};
  const flush=async()=>{try{await flushRaw();sv(true)}catch(err){logErr('guardar',err);sv(false);throw err}};
  const later=()=>{clearTimeout(tm);tm=setTimeout(()=>flush().catch(()=>{}),400)};
  let changingPatient=false;
  const goToPatient=async target=>{
    if(!target||changingPatient)return;
    changingPatient=true;
    const controls=[q('#e-prev'),q('#e-next')];controls.forEach(b=>b.disabled=true);
    try{
      // Persistir cambios antes de cerrar; si falla, quedarse en este expediente.
      await flush();
      await closeSheet(true);
      await openEntry(target);
    }catch(err){
      logErr('cambiar paciente',err);
      if(sheetEl===sh){toast('No se pudo guardar. Intenta de nuevo.');controls[0].disabled=!prevId;controls[1].disabled=!nextId;}
      else toast('No se pudo abrir el paciente');
    }finally{changingPatient=false}
  };
  q('#e-prev').onclick=()=>goToPatient(prevId);
  q('#e-next').onclick=()=>goToPatient(nextId);

  sheetCb=async()=>{try{await flush()}finally{urls.forEach(u=>URL.revokeObjectURL(u));const prev=q('#e-prev-fotos');if(prev&&prev._photoUrls)prev._photoUrls.forEach(u=>URL.revokeObjectURL(u))}};
  ['#e-com','#e-sil','#e-nom','#e-av','#x-peso','#x-gan','#x-ta','#x-otro','#e-nt'].forEach(s=>q(s).addEventListener('input',later));
  q('#e-ac').addEventListener('change',ev=>{later();ev.target.blur()});
  // al salir de cualquier campo se guarda enseguida
  sh.addEventListener('focusout',()=>{clearTimeout(tm);tm=setTimeout(()=>flush().catch(()=>{}),60)});
  const drawTags=()=>{
    const lista=[...catalogo,...e.tags.filter(g=>!catalogo.includes(g))];
    q('#e-tags').innerHTML=lista.length?lista.map((g,i)=>`<button class="tg ${e.tags.includes(g)?'on':''}" data-tg="${i}">${esc(g)}</button>`).join(''):'<div class="mu">Sin etiquetas. Agrégalas en Ajustes.</div>';
    q('#e-tags').dataset.lista=JSON.stringify(lista);
  };
  drawTags();
  q('#e-tags').addEventListener('click',async ev=>{
    const b=ev.target.closest('[data-tg]');if(!b)return;
    const g=JSON.parse(q('#e-tags').dataset.lista)[+b.dataset.tg];
    e.tags=e.tags.includes(g)?e.tags.filter(x=>x!==g):[...e.tags,g];
    await flush().catch(()=>{});drawTags();
  });
  q('#e-tur').onchange=async ev=>{const v=+ev.target.value;ev.target.blur();e.turno=v;S.turno=v;lsSet('turno',v);await flush().catch(()=>{})};
  const drawNota=()=>{}; // Se conserva el estado histórico sin mostrar controles adicionales.
  const drawPend=()=>{

    q('#e-pend').innerHTML=(open.length?[...groups].map(([fecha,items])=>`<div class="mu" style="font-size:11px;margin-top:5px">Desde ${esc(fecha)}</div>${items.map(row).join('')}`).join(''):'<div class="mu">Sin pendientes abiertos</div>')+(done.length?`<details><summary>Resueltos (${done.length})</summary>${done.map(row).join('')}</details>`:'');
  };
  drawPend();
  q('#e-pend').addEventListener('click',async ev=>{
    const t=ev.target.closest('[data-pt]'),x=ev.target.closest('[data-px]');
    if(!t&&!x)return;
    try{
      await mutPat(p=>{
        if(t){const it=p.pendientes.find(z=>z.id===t.dataset.pt);if(it){it.hecho=!it.hecho;it.hechoEn=it.hecho?now():null;it.updatedAt=now()}}
        else{const it=p.pendientes.find(z=>z.id===x.dataset.px);if(it){it.del=true;it.updatedAt=now()}}
      });
      sv(true);
    }catch(err){logErr('pendiente',err);sv(false)}
    drawPend();refreshList();
  });
  const addP=async()=>{const i=q('#e-pin');const t=i.value.trim();if(!t)return;
    try{await mutPat(p=>{p.pendientes.push({id:uid(),texto:t,hecho:false,creado:now(),updatedAt:now()})});i.value='';sv(true)}catch(err){logErr('pendiente',err);sv(false)}

  // Editor de nota: usa los cuatro campos como etiquetas reutilizables.

  const putClipboard=async value=>{
    try{await navigator.clipboard.writeText(value);toast('Nota copiada')}catch(err){

      window.prompt('Copia la nota:',value);

  q('#e-note-copy').onclick=async()=>{await flush();await putClipboard(filledNote())};
  q('#e-note-paste').onclick=async()=>{
    try{const value=await navigator.clipboard.readText();if(!value)return;
      if(noteArea.value.trim()&&!confirm('¿Sustituir la nota actual por el texto del portapapeles?'))return;
      noteArea.value=value;later();toast('Texto pegado');
    }catch(err){toast('Mantén pulsado el campo de nota y elige Pegar')}
  };
  q('#e-note-prior').onclick=async()=>{
    const list=(await all('entries')).filter(x=>!x.deleted&&x.expediente===e.expediente&&x.id!==e.id&&x.notaTxt).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.creado||0)-(a.creado||0));

    if(noteArea.value.trim()&&!confirm('¿Reemplazar el texto actual con la nota anterior?'))return;

  // cambios que llegan de otro dispositivo mientras esta hoja está abierta
  live={e,flush,drawNota,
    setE:r=>{
      e.nota=!!r.nota;e.tags=r.tags||[];e.turno=r.turno;e.updatedAt=r.updatedAt;e.deleted=!!r.deleted;
      if(r.fotos)e.fotos=r.fotos;

      pat=p;if(sheetEl!==sh)return;drawPend();

      if(fo!==q('#e-ac'))q('#e-ac').value=p.acceso||'';
    }};
  q('#e-reuse').onclick=async()=>{
    const entries=(await all('entries')).filter(x=>!x.deleted&&x.expediente===e.expediente&&x.id!==e.id&&x.comentario)
      .sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.creado||0)-(a.creado||0));
    if(!entries.length){toast('No hay comentario anterior');return}
    const ta=q('#e-com');
    if(ta.value.trim()&&!confirm('¿Reemplazar el comentario de hoy por el anterior?'))return;
    ta.value=entries[0].comentario;ta.dispatchEvent(new Event('input',{bubbles:true}));
    await flush();toast('Comentario anterior reutilizado');
  };
  q('#e-padd').onclick=addP;q('#e-pin').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();addP()}});

  const drawFotos=async()=>{
    urls.splice(0).forEach(u=>URL.revokeObjectURL(u));
    const keep=[];let html='';

// Escala de grises + un poco de contraste: las hojas son texto, así pesan mucho menos y se leen igual.
function procGris(d,contraste=1.2,pivote=140){
  for(let i=0;i<d.length;i+=4){
    let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    g=(g-pivote)*contraste+pivote;
    g=g<0?0:g>255?255:g;
    d[i]=d[i+1]=d[i+2]=g;
  }
  return d;
}
function compress(file,modo){return new Promise((res,rej)=>{
  const ligera=modo!=='normal';
  const max=ligera?1280:1600,qual=ligera?.6:.72;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    try{
      const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*r)),h=Math.max(1,Math.round(img.naturalHeight*r));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
      if(ligera){const id=ctx.getImageData(0,0,w,h);procGris(id.data);ctx.putImageData(id,0,0)}
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',qual);
    }catch(err){URL.revokeObjectURL(url);rej(err)}
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url;});}

async function purge(){
  const lim=now()-DIAS_FOTO*DAY;let n=0;const gone=new Set();
  for(const p of await all('photos'))if(p.created<lim){await del('photos',p.id);gone.add(p.id);n++}
  if(gone.size)for(const e of await all('entries')){
    const k=(e.fotos||[]).filter(i=>!gone.has(i));
    // las fotos son locales: limpiar la lista no cuenta como cambio para la sincronización
    if(k.length!==(e.fotos||[]).length){e.fotos=k;await put('entries',e,{nosync:true})}}
  return n;
}

async function exportar(conFotos){
  const data={app:'pase-hd',version:1,exportado:now(),tags:await getTags(),patients:await all('patients'),entries:await all('entries'),photos:[]};

  const name=`pase-hd-${todayStr()}.json`;

    catch(err){if(err&&err.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();

async function importar(file){

    window._paseSearchTimer=setTimeout(async()=>{
      try{
        const [pats,dated]=await Promise.all([all('patients'),byDate(S.fecha)]);
        if(S.busqueda.toLowerCase()!==q||!target.isConnected)return;
        const selected=new Set(cards.map(c=>c.dataset.exp));
        const matches=pats.filter(p=>!p.deleted&&p.expediente.toLowerCase().includes(q)&&!selected.has(p.expediente.toLowerCase())).slice(0,8);
        target.innerHTML=matches.length?`<div class="box"><b>Otros expedientes</b><p class="mu">Pacientes fuera de este turno. Puedes consultar su historial sin agregar una sesión.</p>${matches.map(p=>{
          const e=dated.find(x=>x.expediente===p.expediente);
          return `<div class="tgrow"><span><b>${esc(p.nombre||'(sin nombre)')}</b><small> · ${esc(p.expediente)}</small></span><button type="button" ${e?`data-open="${esc(e.id)}"`:`data-profile="${esc(p.expediente)}"`}>${e?'Abrir':'Historial'}</button></div>`;
        }).join('')}</div>`:'';
      }catch(err){logErr('buscador',err)}
    },160);
  }
});
document.addEventListener('click',async ev=>{
  const t=ev.target;if(!t.closest)return;
  if(t.id==='pase-clear'){S.busqueda='';const q=$('#pase-q');if(q){q.value='';q.dispatchEvent(new Event('input',{bubbles:true}));q.focus()}return;}
  const nav=t.closest('nav button');
  if(nav){if(sheetEl&&sheetDocked)closeSheet(true);S.view=nav.dataset.v;render();window.scrollTo(0,0);return}
  const kc=t.closest('[data-k]');if(kc){calcKey(kc.dataset.k);return}
  if(t.id==='archivo-volver'){S.view='resp';await render();return}
  if(t.id==='settings-archivo'){S.view='archivo';await render();window.scrollTo(0,0);return}
  if(t.closest('[data-add]')){openAdd();return}
  if(t.closest('[data-batch]')){openBatch();return}
  const profile=t.closest('[data-profile]');if(profile){openProfile(profile.dataset.profile);return}
  if(t.closest('[data-close]')){closeSheet();return}
  if(t.id==='ov'){closeSheet();return}
  if(t.closest('[data-bn]')){lsSet('bannerOff','1');render();return}
  const dn=t.closest('[data-d]');
  if(dn&&S.view==='hoy'){const v=+dn.dataset.d;
    if(sheetEl&&sheetDocked)closeSheet(true);
    if(v===0)S.fecha=todayStr();else{const d=new Date(S.fecha+'T12:00:00');d.setDate(d.getDate()+v);S.fecha=todayStr(d)}
    S.hoy=S.fecha===todayStr();render();return}
  const tab=t.closest('[data-t]');if(tab){S.turno=+tab.dataset.t;lsSet('turno',S.turno);render();return}
  const nt=t.closest('[data-nota]');
  if(nt){
    if(live&&live.e.id===nt.dataset.nota){live.e.nota=!live.e.nota;live.drawNota();await live.flush().catch(()=>{});render();return}
    const e=await get('entries',nt.dataset.nota);e.nota=!e.nota;e.updatedAt=now();await put('entries',e);render();return}
  const pt=t.closest('[data-pt][data-pe]');
  if(pt){const p=await get('patients',pt.dataset.pe);const x=p.pendientes.find(z=>z.id===pt.dataset.pt);x.hecho=true;x.hechoEn=now();x.updatedAt=now();p.updatedAt=now();await put('patients',p);render();toast('Pendiente resuelto');return}
  const op=t.closest('[data-open]');
  if(op){
    const e=await get('entries',op.dataset.open);
    if(e&&isWide()&&S.view!=='hoy'){S.view='hoy';S.fecha=e.fecha;S.turno=e.turno;S.hoy=e.fecha===todayStr();await render()}
    openEntry(op.dataset.open);return}
  const card=t.closest('.card[data-id]');if(card){openEntry(card.dataset.id);return}
  const tgd=t.closest('[data-tgi]');
  if(tgd){const a=await getTags();a.splice(+tgd.dataset.tgi,1);await setTags(a);render();return}
  if(t.id==='tg-add'){const v=$('#tg-in').value.trim();if(!v)return;const a=await getTags();if(!a.includes(v)){a.push(v);await setTags(a)}render();return}
  if(t.id==='tg-def'){if(confirm('¿Restaurar la lista de etiquetas por defecto?')){await setTags(DEF_TAGS.slice());render()}return}
  if(t.id==='sy-login'){
    const m=$('#sy-mail').value.trim(),p=$('#sy-pass').value,msg=$('#sy-msg');
    if(!m||!p){msg.textContent='Escribe tu correo y contraseña';return}
    msg.textContent='Entrando…';
    try{await SYNC.login(m,p)}catch(err){msg.textContent=err.message}
    return}
  if(t.id==='sy-out'){if(confirm('¿Cerrar sesión? Tus datos se quedan en este dispositivo.')){await SYNC.logout();render()}return}
  if(t.id==='sy-now'){await SYNC.syncNow();toast('Sincronizando…');render();return}
  const sn=t.closest('[data-sn]');if(sn){await SYNC.setNames(sn.dataset.sn==='1');render();return}
  const sp=t.closest('[data-sp]');if(sp){await SYNC.setPhotos(sp.dataset.sp==='1');render();return}
  const fq=t.closest('[data-fq]');
  if(fq){await put('meta',{k:'foto',v:fq.dataset.fq});render();toast('Calidad: '+(fq.dataset.fq==='normal'?'normal':'ligera'));return}
  if(t.id==='er-copy'){const txt=JSON.stringify(readErrs(),null,1);
    try{await navigator.clipboard.writeText(txt);toast('Copiado')}catch(err){prompt('Copia este texto:',txt)}return}
  if(t.id==='er-clear'){lsSet('errlog','[]');render();return}
  if(t.id==='r-del'){if(confirm('¿Borrar TODAS las fotos de hojas de signos? Si la sincronización de fotos está activa, también se borran en tus otros dispositivos.')){
    for(const p of await all('photos')){await del('photos',p.id);SYNC.dropPhoto(p)}
    for(const e of await all('entries'))if(e.fotos&&e.fotos.length){e.fotos=[];e.updatedAt=now();await put('entries',e)}
    toast('Fotos borradas');render()}return}
  if(t.id==='r-exp'){const ok=await exportar($('#r-fot').checked);if(ok){toast('Respaldo listo');render()}return}

document.addEventListener('change',async ev=>{
  if(ev.target.id==='r-file'){const f=ev.target.files[0];ev.target.value='';if(!f)return;
    try{const r=await importar(f);toast(`Importado: ${r.a} pacientes, ${r.b} registros`);render()}catch(err){logErr('importar',err);alert('No se pudo importar: '+err.message)}}
});

/* ---------- Sincronización con Firebase (opcional) ----------
   Cada dispositivo sigue guardando todo local. Aquí solo se suben los cambios y se bajan los de los demás.
   Cada registro (paciente, pendiente, sesión, etiquetas) lleva updatedAt: gana el cambio más reciente.
   Las fotos NO se sincronizan (viven solo en el dispositivo donde se tomaron). */
const SYNC=(()=>{
  const st={uid:null,email:'',status:'init',pending:0,denied:0,last:0,err:'',syncNames:true,syncPhotos:true,remote:{},unsubs:[],chain:Promise.resolve(),first:{},forceNames:false,fs:null,auth:null};
  const DIAS_ENT=36500; // Historial completo: no limitar la sincronización a 45 días
  const cfgOk=()=>{try{const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&c.projectId&&!/PEGA_AQUI/.test(JSON.stringify(c)))}catch(e){return false}};
  const typing=()=>{const a=document.activeElement;return !!(a&&/^sy-/.test(a.id||''))};
  const changed=()=>{clearTimeout(changed.t);changed.t=setTimeout(()=>{try{if(S.view==='resp'&&!sheetEl&&!typing())render().catch(()=>{})}catch(e){}},200)};
  const ref=(coll,id)=>{const c=st.fs.collection('users').doc(st.uid).collection(coll);return id==null?c:c.doc(coll==='meta'?id:encodeURIComponent(id))};
  const enq=fn=>{st.chain=st.chain.then(fn).catch(e=>logErr('sync',e));return st.chain};
  const fail=(err,n=1)=>{if(err&&err.code==='permission-denied')st.denied+=n;else logErr('subir',err)};

  /* --- registros --- */
  const recPat=p=>{const r={expediente:p.expediente,acceso:p.acceso||'',aviso:p.aviso||'',updatedAt:patStamp(p)};if(st.syncNames)r.nombre=p.nombre||'';return r};
  const recPend=(p,x)=>({id:x.id,expediente:p.expediente,texto:x.texto,hecho:!!x.hecho,hechoEn:x.hechoEn||null,creado:x.creado||0,del:!!x.del,updatedAt:pStamp(x)});
  const recEnt=e=>{const r={...e};delete r.fotos;r.deleted=!!e.deleted;r.updatedAt=e.updatedAt||0;return r};
  // Fotos: ya vienen comprimidas (ligeras ~100-150 KB); van dentro del documento como texto base64.
  // Un documento de Firestore admite ~1 MB, por eso se descarta lo que pase de este límite.
  const MAX_FOTO=950000;
  async function recPhoto(ph){
    const data=await blobToData(ph.blob);
    if(data.length>MAX_FOTO)return null;
    return {id:ph.id,entry:ph.entry||'',expediente:ph.expediente||'',created:ph.created||0,deleted:false,data,updatedAt:ph.created||0};
  }
  function itemsFor(name,v){
    if(name==='patients'){const a=[['patients',v.expediente,recPat(v)]];for(const x of v.pendientes||[])a.push(['pendientes',x.id,recPend(v,x)]);return a}
    if(name==='entries')return [['entries',v.id,recEnt(v)]];
    if(name==='meta'&&v.k==='tags')return [['meta','tags',{v:v.v,updatedAt:v.updatedAt||0}]];
    return [];
  }
  const due=it=>{const k=it[0]+'~'+it[1],s=it[2].updatedAt;return st.remote[k]===undefined||s>st.remote[k]};

  /* --- subir --- */
  function write(it){
    st.remote[it[0]+'~'+it[1]]=it[2].updatedAt;st.pending++;
    return ref(it[0],it[1]).set(it[2],{merge:true})
      .then(()=>{st.last=now()})
      .catch(fail)
      .then(()=>{st.pending--;changed()});
  }
  function push(name,v){if(!st.uid||!st.fs)return;for(const it of itemsFor(name,v))if(due(it))write(it)}
  async function pushPhoto(ph){
    if(!st.uid||!st.fs||!st.syncPhotos||!ph)return;
    try{
      const rec=await recPhoto(ph);
      if(!rec){logErr('foto','Foto demasiado pesada para sincronizar');return 'pesada'}
      const it=['photos',ph.id,rec];if(due(it))write(it);
    }catch(e){logErr('foto',e)}
  }
  // borrar una foto = dejar una marca (sin imagen) para que los demás dispositivos también la quiten
  function dropPhoto(ph){
    if(!st.uid||!st.fs||!st.syncPhotos||!ph)return;
    write(['photos',ph.id,{id:ph.id,entry:ph.entry||'',expediente:ph.expediente||'',created:ph.created||0,deleted:true,data:'',updatedAt:now()}]);
  }
  // la nube solo conserva las fotos de los últimos 7 días, igual que los dispositivos
  async function purgeRemote(){
    if(!st.uid||!st.fs||!st.syncPhotos)return;
    try{
      const snap=await ref('photos').where('created','<',now()-DIAS_FOTO*DAY).get();
      snap.forEach(d=>{d.ref.delete().catch(fail)});
    }catch(e){logErr('limpiar nube',e)}
  }
  async function pushAll(){
    if(!st.uid||!st.fs)return;
    const items=[];
    for(const p of await all('patients'))items.push(...itemsFor('patients',p));
    const cut=todayStr(new Date(Date.now()-DIAS_ENT*DAY));
    for(const e of await all('entries'))if((e.fecha||'')>=cut)items.push(...itemsFor('entries',e));
    const t=await get('meta','tags');
    if(t){if(!t.updatedAt){t.updatedAt=now();await put('meta',t,{nosync:true})}items.push(...itemsFor('meta',t))}
    items.filter(due).forEach(write);
    if(st.syncPhotos){ // fotos que ya estaban en este dispositivo y la nube todavía no tiene
      const lim=now()-DIAS_FOTO*DAY;
      for(const k of await rq(store('photos').getAllKeys())){
        if(st.remote['photos~'+k]!==undefined)continue;
        const ph=await get('photos',k);if(!ph||(ph.created||0)<lim)continue;
        await pushPhoto(ph);
      }
    }
  }

  /* --- bajar --- */
  async function applyRemote(name,r){
    if(name==='patients'){
      const cur=await get('patients',r.expediente),rs=r.updatedAt||0;
      if(!st.forceNames&&cur&&patStamp(cur)>=rs)return null;
      const p=cur||{expediente:r.expediente,nombre:'',pendientes:[],updatedAt:0};
      if(st.syncNames&&typeof r.nombre==='string')p.nombre=r.nombre;
      if('acceso' in r)p.acceso=r.acceso;if('aviso' in r)p.aviso=r.aviso;
      p.pu=rs;p.updatedAt=Math.max(p.updatedAt||0,rs);
      await put('patients',p,{nosync:true});return p;
    }
    if(name==='pendientes'){
      let p=await get('patients',r.expediente);
      if(!p)p={expediente:r.expediente,nombre:'',pendientes:[],updatedAt:0,pu:0};
      const i=p.pendientes.findIndex(x=>x.id===r.id),rs=r.updatedAt||0;
      if(i>=0&&pStamp(p.pendientes[i])>=rs)return null;
      const item={id:r.id,texto:r.texto,hecho:!!r.hecho,hechoEn:r.hechoEn||null,creado:r.creado||0,updatedAt:rs,del:!!r.del};
      if(i>=0)p.pendientes[i]=item;else p.pendientes.push(item);
      p.updatedAt=Math.max(p.updatedAt||0,rs);
      await put('patients',p,{nosync:true});return p;
    }
    if(name==='entries'){
      const cur=await get('entries',r.id);
      if(cur&&(cur.updatedAt||0)>=(r.updatedAt||0))return null;
      // las fotos que ya llegaron antes que su sesión se enlazan aquí
      const ids=await photoIdsOf(r.id);
      const e={...r,fotos:[...new Set([...(cur&&cur.fotos||[]),...ids])]};
      await put('entries',e,{nosync:true});return e;
    }
    if(name==='photos'){
      const cur=await get('photos',r.id);
      if(r.deleted){
        if(cur)await del('photos',r.id);
        const e=await get('entries',r.entry);
        if(e&&(e.fotos||[]).includes(r.id)){e.fotos=e.fotos.filter(x=>x!==r.id);await put('entries',e,{nosync:true})}
        return cur?{photo:true,entry:r.entry}:null;
      }
      if(cur||!r.data||(r.created||0)<now()-DIAS_FOTO*DAY)return null;
      const blob=await (await fetch(r.data)).blob();
      await putRaw('photos',{id:r.id,blob,created:r.created,entry:r.entry,expediente:r.expediente});
      const e=await get('entries',r.entry);
      if(e){if(!e.fotos)e.fotos=[];if(!e.fotos.includes(r.id)){e.fotos.push(r.id);await put('entries',e,{nosync:true})}}
      return {photo:true,entry:r.entry};
    }
    if(name==='meta'&&r.v&&Array.isArray(r.v)){
      const cur=await get('meta','tags');
      if(cur&&(cur.updatedAt||0)>=(r.updatedAt||0))return null;
      await put('meta',{k:'tags',v:r.v,updatedAt:r.updatedAt||0},{nosync:true});return {tags:true};
    }
    return null;
  }
  function afterApply(name,res){
    try{
      if(live){
        if(name==='entries'&&res.id===live.e.id){if(res.deleted){live.e.deleted=true;closeSheet()}else live.setE(res)}
        if(name==='photos'&&res.entry===live.e.id)live.refreshFotos();
        if((name==='patients'||name==='pendientes')&&res.expediente===live.e.expediente)live.setPat(res);
      }
    }catch(e){logErr('sync',e)}
    clearTimeout(afterApply.t);
    afterApply.t=setTimeout(()=>{if(db&&!typing())render().catch(()=>{})},150);
  }
  function unlisten(){st.unsubs.forEach(u=>{try{u()}catch(e){}});st.unsubs=[]}
  function listen(){
    unlisten();st.first={};
    const cut=todayStr(new Date(Date.now()-DIAS_ENT*DAY));
    const defs=[['patients',ref('patients')],['pendientes',ref('pendientes')],['entries',ref('entries').where('fecha','>=',cut)],['meta',ref('meta')]];
    if(st.syncPhotos)defs.push(['photos',ref('photos').where('created','>=',now()-DIAS_FOTO*DAY)]);
    defs.forEach(([name,q])=>{
      st.unsubs.push(q.onSnapshot(snap=>{
        snap.docChanges().forEach(ch=>{
          if(ch.type==='removed')return;
          const d=ch.doc.data();
          const id=name==='patients'?d.expediente:name==='meta'?ch.doc.id:d.id;
          st.remote[name+'~'+id]=d.updatedAt||0;
          enq(async()=>{
            const res=await applyRemote(name,d);if(res)afterApply(name,res);
            // al reactivar los nombres: si la nube no tiene nombre de este paciente pero aquí sí, se publica
            if(name==='patients'&&st.forceNames&&st.syncNames&&typeof d.nombre!=='string'){
              const p=await get('patients',d.expediente);
              if(p&&p.nombre){p.pu=now();p.updatedAt=now();await put('patients',p)}
            }
          });
        });
        if(!st.first[name]){st.first[name]=true;if(defs.every(x=>st.first[x[0]])){enq(()=>pushAll());enq(()=>purgeRemote())}}
        st.last=st.last||now();changed();
      },err=>{st.err=(err&&err.code)||String(err);logErr('escuchar '+name,err);changed()}));
    });
  }

  /* --- sesión --- */
  const msgAuth=e=>{const c=(e&&e.code)||'';
    return /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?'Correo o contraseña incorrectos'
      :/network/.test(c)?'Sin conexión a internet'
      :/too-many/.test(c)?'Demasiados intentos, espera unos minutos'
      :/unauthorized-domain/.test(c)?'Este dominio no está autorizado en Firebase'
      :(e&&e.message)||'No se pudo iniciar sesión'};
  function init(){
    if(!cfgOk()){st.status='nocfg';changed();return}
    if(typeof firebase==='undefined'){st.status='nosdk';changed();return}
    try{
      firebase.initializeApp(window.FIREBASE_CONFIG);
      st.auth=firebase.auth();st.fs=firebase.firestore();
      try{st.fs.settings({ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,merge:true})}catch(e){logErr('firestore',e)}
      try{const p=st.fs.enablePersistence({synchronizeTabs:true});if(p&&p.catch)p.catch(e=>logErr('persistencia',e))}catch(e){logErr('persistencia',e)}
    }catch(e){logErr('firebase',e);st.status='error';st.err=String((e&&e.message)||e);changed();return}
    st.status='out';
    st.auth.onAuthStateChanged(async u=>{
      try{
        if(u){const m=await get('meta','syncnames');st.syncNames=!(m&&m.v===false);
          const m2=await get('meta','syncphotos');st.syncPhotos=!(m2&&m2.v===false);st.uid=u.uid;st.email=u.email||'';st.status='on';listen()}
        else{unlisten();st.uid=null;st.email='';st.status='out'}
      }catch(e){logErr('sesión',e)}
      changed();
    });
    changed();
  }
  async function login(email,pass){
    if(!st.auth)throw new Error('La sincronización no está disponible');
    try{await st.auth.signInWithEmailAndPassword(email,pass)}catch(e){throw new Error(msgAuth(e))}
  }
  const logout=()=>st.auth?st.auth.signOut():Promise.resolve();
  async function setNames(on){
    st.syncNames=!!on;await put('meta',{k:'syncnames',v:!!on},{nosync:true});
    if(st.uid){
      if(on){st.forceNames=true;setTimeout(()=>{st.forceNames=false},20000)} // al activar: se recuperan los nombres de la nube
      listen();
    }
    changed();
  }
  async function setPhotos(on){
    st.syncPhotos=!!on;await put('meta',{k:'syncphotos',v:!!on},{nosync:true});
    if(st.uid)listen(); // al encender se bajan las fotos de la nube y se suben las que solo están aquí
    changed();
  }
  const syncNow=()=>{if(!st.uid)return Promise.resolve();listen();return enq(()=>pushAll())};
  return {push,pushPhoto,dropPhoto,init,login,logout,setNames,setPhotos,syncNow,state:()=>st};
})();

/* ---------- Inicio ---------- */
(async()=>{
  try{db=await openDB()}catch(e){logErr('abrir base',e);$('#main').innerHTML='<div class="empty">Este navegador no permite guardar datos locales (¿modo privado?).</div>';return}
  await purge();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  await render();
  // la sincronización arranca cuando terminan de cargar los scripts de Firebase
  if(document.readyState==='complete')SYNC.init();else window.addEventListener('load',()=>SYNC.init());
  setInterval(()=>purge().catch(()=>{}),36e5);
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible')return;
    await purge().catch(()=>{});
    if(S.hoy&&S.fecha!==todayStr())S.fecha=todayStr();
    if(!sheetEl)render();
  });
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
